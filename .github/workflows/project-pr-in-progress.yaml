name: Project PR open comments - set In Progress

# TWIN_GHA_RELEASE_TOKEN requires
# org->project: read/write
# repos->pull-requests: read

on:
  pull_request_review:
    types: [submitted]
  pull_request_review_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull request number
        required: true
        type: number

jobs:
  set-in-progress:
    runs-on:
      labels: ${{ github.event.repository.private && 'self-hosted-small' || 'ubuntu-latest' }}
      group: ${{ github.event.repository.private && 'twin' || 'default' }}

    steps:
      - uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.TWIN_GHA_RELEASE_TOKEN }}
          script: |
            const prNumber = context.eventName === 'workflow_dispatch'
              ? parseInt(context.payload.inputs.pr_number, 10)
              : context.payload.pull_request.number;
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const projectNumber = 104;

            // Fetch unresolved review threads and the PR's project items in one query
            const { repository } = await github.graphql(`
              query($owner: String!, $repo: String!, $prNumber: Int!) {
                repository(owner: $owner, name: $repo) {
                  pullRequest(number: $prNumber) {
                    reviewThreads(first: 100) {
                      nodes { isResolved }
                    }
                    projectItems(first: 10) {
                      nodes {
                        id
                        project { id number }
                      }
                    }
                  }
                }
              }
            `, { owner, repo, prNumber });

            const pr = repository.pullRequest;
            const hasOpenThreads = pr.reviewThreads.nodes.some(t => !t.isResolved);
            if (!hasOpenThreads) {
              console.log('No unresolved review threads — skipping.');
              return;
            }

            const projectItem = pr.projectItems.nodes.find(n => n.project.number === projectNumber);
            if (!projectItem) {
              console.log(`PR #${prNumber} is not in project ${projectNumber} — skipping.`);
              return;
            }

            // Get the Status field options for the project
            const { organization } = await github.graphql(`
              query($org: String!, $projectNumber: Int!) {
                organization(login: $org) {
                  projectV2(number: $projectNumber) {
                    field(name: "Status") {
                      ... on ProjectV2SingleSelectField {
                        id
                        options { id name }
                      }
                    }
                  }
                }
              }
            `, { org: owner, projectNumber });

            const statusField = organization.projectV2.field;
            const inProgressOption = statusField.options.find(o => o.name === 'In Progress');
            if (!inProgressOption) {
              core.setFailed('Could not find "In Progress" option in the Status field.');
              return;
            }

            await github.graphql(`
              mutation($projectId: ID!, $itemId: ID!, $fieldId: ID!, $optionId: String!) {
                updateProjectV2ItemFieldValue(input: {
                  projectId: $projectId
                  itemId: $itemId
                  fieldId: $fieldId
                  value: { singleSelectOptionId: $optionId }
                }) {
                  projectV2Item { id }
                }
              }
            `, {
              projectId: projectItem.project.id,
              itemId: projectItem.id,
              fieldId: statusField.id,
              optionId: inProgressOption.id,
            });

            console.log(`PR #${prNumber} moved to "In Progress".`);
